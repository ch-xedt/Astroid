    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1318;
        --s2: #1b2027;
        --s3: #252b33;

        --sc: #3b4858;
        --osc: #d7e3f7;
        --err: #ffb4ab;
        --ease: cubic-bezier(0.2, 0, 0, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--on);
        font:
          400 16px/1.5 Roboto,
          'Segoe UI',
          system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      header {
        padding: 20px 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      header svg {
        width: 28px;
        height: 28px;
      }
      footer {
        padding: 16px 20px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #note {
        font-size: 11px;
        color: var(--var);
        opacity: 0.7;
        text-align: center;
        max-width: 340px;
      }

      #stage {
        flex: 1;
        position: relative;
        overflow: hidden;
        --R: 160px;
      }
      .orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        border-radius: 50%;
        border: 1px solid rgba(224, 226, 232, 0.07);
        transform: translate(-50%, -50%);
        width: calc(var(--R) * 2);
        height: calc(var(--R) * 2);
        transition:
          width 0.5s var(--ease),
          height 0.5s var(--ease),
          opacity 0.4s;
      }
      .o2 {
        width: calc(var(--R) * 1.16);
        height: calc(var(--R) * 1.16);
        opacity: 0;
      }
      .many .o2 {
        opacity: 1;
      }
      .self {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 64px;
        height: 64px;
        margin: -32px;
        border-radius: 50%;
        background: var(--pc);
        color: var(--opc);
        display: grid;
        place-items: center;
      }
      .self::before,
      .self::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--pri);
        opacity: 0;
        animation: ping 3.6s var(--ease) infinite;
      }
      .self::after {
        animation-delay: 1.8s;
      }
      .has .self::before,
      .has .self::after {
        animation: none;
      }
      @keyframes ping {
        from {
          transform: scale(1);
          opacity: 0.5;
        }
        to {
          transform: scale(4.5);
          opacity: 0;
        }
      }
      .ic {
        width: 28px;
        height: 28px;
        fill: currentColor;
      }
      #empty {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + 72px);
        text-align: center;
        color: var(--var);
        font-size: 15px;
        padding: 0 24px;
      }
      .has #empty {
        display: none;
      }

      .peer {
        all: unset;
        box-sizing: border-box;
        position: absolute;
        left: 50%;
        top: 50%;
        width: 112px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        opacity: 0;
        transform: translate(calc(-50% + var(--x, 0px)), calc(-50% + var(--y, 0px)));
        transition:
          transform 0.7s var(--ease),
          opacity 0.3s;
      }
      .peer.in {
        opacity: 1;
      }
      .peer:focus-visible .rock {
        outline: 2px solid var(--pri);
        outline-offset: 6px;
      }
      .rock {
        position: relative;
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: var(--b);
        background: hsl(var(--h) 24% 27%);
        color: hsl(var(--h) 75% 86%);
        transition:
          border-radius 0.5s var(--ease),
          transform 0.3s var(--ease);
      }
      .peer:hover .rock,
      .peer.over .rock {
        border-radius: var(--b2);
      }
      .peer.over .rock {
        transform: scale(1.15);
      }
      .peer:active .rock {
        transform: scale(0.94);
      }
      .ring {
        position: absolute;
        inset: -10px;
        width: 92px;
        height: 92px;
        transform: rotate(-90deg);
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .busy .ring {
        opacity: 1;
      }
      .wait .ring {
        animation: spin 1.1s linear infinite;
      }
      .ring circle {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
      }
      .ring .bg {
        stroke: var(--out);
      }
      .ring .fg {
        stroke: var(--pri);
        stroke-dasharray: 264;
        stroke-dashoffset: 264;
        transition: stroke-dashoffset 0.15s linear;
      }
      @keyframes spin {
        from {
          transform: rotate(-90deg);
        }
        to {
          transform: rotate(270deg);
        }
      }
      .nm {
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        line-height: 1.25;
      }
      .sub {

      }
      .acts {
        display: flex;

        gap: 4px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .tb {
        all: unset;
        cursor: pointer;
        padding: 10px 14px;
        border-radius: 999px;
        color: var(--pri);
        font-size: 14px;
        font-weight: 500;
      }
      .tb:hover {
        background: rgba(164, 201, 254, 0.08);
      }
      .tb:focus-visible {
        outline: 2px solid var(--pri);
      }
      #rin {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        margin-top: 20px;
        padding: 14px 16px;
        border: 1px solid var(--out);
        border-radius: 12px;
        font-size: 17px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-align: center;
      }
      #rin:focus {
        border: 2px solid var(--pri);
        padding: 13px 15px;
      }
      .warn {
        font-size: 12px;
        color: var(--var);
        margin-top: 12px;
      }

      #toasts {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(88px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
        padding: 0 16px;
      }
      .snack {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 280px;
        max-width: 100%;
        padding: 6px 8px 6px 16px;
        border-radius: 4px;
        background: #2f353d;
        color: #eef0f6;
        font-size: 14px;
        animation: pop 0.25s var(--ease);
      }
      .snack span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 8px 0;
      }
      .snack a {
        color: var(--pri);
        text-decoration: none;
        font-weight: 500;
        padding: 10px 12px;
        border-radius: 999px;
      }
      .snack a:hover,
      .snack button:hover {
        background: rgba(164, 201, 254, 0.08);
      }
      .snack button {
        all: unset;
        cursor: pointer;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: var(--var);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01s !important;
        }
      }
    </style>

  <body>

    <script>
      if (window.top !== window.self) {
        document.documentElement.remove();
        throw new Error('framed');
      }

      const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
      const ICE = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
      ];
      const BLOCK = 4 << 20,
        HIGH_WATER = 12 << 20,
        SPILL = 16 << 20,
        ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      const MAX_FILE_SIZE = 500 * 1024 * 1024;
      const MAX_FILES = 100,
        MAX_SESSIONS = 5,
        MAX_MQTT_PKT = 1 << 20,
        MSG_TTL = 5 * 60 * 1000;
      const CODE_LEN = 16,
        CODE_MIN = 12;
      const ICONS = {
        phone:
          'M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z',
        tablet:
          'M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 1.99-.9 1.99-2L23 6c0-1.1-.9-2-2-2zm-2 14H5V6h14v12z',
        laptop:
          'M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z',
        desktop:
          'M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z',
      };
      const $ = (s) => document.querySelector(s);
      const enc = new TextEncoder(),
        dec = new TextDecoder();
      const hex = (buf) =>
        Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
      const ID_RE = /^[0-9a-f]{16}$/,
        SID_RE = /^[0-9a-f]{32}$/;

      const rid = () => hex(crypto.getRandomValues(new Uint8Array(8)));
      const pickCrypto = (a) => {
        const b = new Uint32Array(1);
        crypto.getRandomValues(b);
        return a[b[0] % a.length];
      };

      const code = () => {
        let out = '';
        while (out.length < CODE_LEN) {
          for (const x of crypto.getRandomValues(new Uint8Array(32)))
            if (x < 248 && out.length < CODE_LEN) out += ALPHA[x % 31];
        }
        return out;
      };

      const fmt = (n) => {
        const u = ['B', 'KB', 'MB', 'GB'];
        let i = 0;
        while (n >= 1024 && i < 3) {
          n /= 1024;
          i++;
        }
        return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + ' ' + u[i];
      };
      const hash = (s) => [...s].reduce((a, c) => (Math.imul(a, 31) + c.charCodeAt(0)) | 0, 7);
      const blob = (seed) => {
        let s = seed >>> 0;
        const r = () => 38 + ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296) * 24;
        const a = r(),
          b = r(),
          c = r(),
          d = r();
        return `${a}% ${100 - a}% ${b}% ${100 - b}% / ${c}% ${d}% ${100 - d}% ${100 - c}%`;
      };

      const ua = navigator.userAgent;
      const device =
        /iPad|Tablet/.test(ua) ||
        (/Android/.test(ua) && !/Mobile/.test(ua)) ||
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
          ? 'tablet'
          : /Mobi|iPhone|Android/.test(ua)
            ? 'phone'
            : /Macintosh|Mac OS/.test(ua)
              ? 'laptop'
              : 'desktop';

      const ADJ = [
          'Dumb',
          'Broke',
          'Stupid',
          'Fried',
          'Brainless',
          'Cooked',
          'Cringe'
        ],
        AN = [
          'Moron',
          'Chad',
          'Alpha-Male',
          'Donky',
          'Dipshit',
          'Nerd',
          'Chickenbutt'
        ];
      const nameFor = (id) => {
        const h = Math.abs(hash(id));
        return `${ADJ[h % ADJ.length]} ${AN[((h / ADJ.length) | 0) % AN.length]}`;
      };
      const cleanName = (n, id) => {
        const [a, b, ...x] = String(n).split(' ');
        return !x.length && ADJ.includes(a) && AN.includes(b) ? a + ' ' + b : nameFor(id);
      };

      const sanitizeFilename = (name) => {
        let n = String(name)
          .replace(/[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069\/\\:*?"<>|]/g, '_')
          .replace(/^[.\s]+/, '')
          .trim()
          .slice(0, 200);
        return n || 'file';
      };

      function myName() {
        try {
          const n = localStorage.getItem('astroid-name-en');
          if (n) return n;
        } catch {}
        const n = `${pickCrypto(ADJ)} ${pickCrypto(AN)}`;
        try {
          localStorage.setItem('astroid-name-en', n);
        } catch {}
        return n;
      }
      const me = { id: rid(), name: myName(), device };
      const peers = new Map(),
        sessions = new Map(),
        seenAt = new Map(),
        lastP = new Map(),
        t0s = new Map();

      let roomCryptoKey = null;
      async function sha256hex(s) {
        return hex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
      }

      async function deriveRoomKey(secret) {
        const km = await crypto.subtle.importKey(
          'raw',
          enc.encode('astroid-key:' + secret),
          'PBKDF2',
          false,
          ['deriveKey'],
        );
        return crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: enc.encode('astroid-key-salt-v2'),
            iterations: 100000,
            hash: 'SHA-256',
          },
          km,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt'],
        );
      }
      const b64 = (u8) => btoa(String.fromCharCode(...u8));
      const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

      async function encryptPayload(obj) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          roomCryptoKey,
          enc.encode(JSON.stringify(obj)),
        );
        return JSON.stringify({ iv: b64(iv), d: b64(new Uint8Array(ct)) });
      }
      async function decryptPayload(str) {
        try {
          if (!roomCryptoKey || str.length > 200000) return null;
          const p = JSON.parse(str);
          if (typeof p.iv !== 'string' || typeof p.d !== 'string') return null;
          const pt = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: unb64(p.iv) },
            roomCryptoKey,
            unb64(p.d),
          );
          return JSON.parse(dec.decode(pt));
        } catch {
          return null;
        }
      }

      function mqtt(url, onopen, onmsg) {
        let ws,
          t,
          buf = new Uint8Array(0);
        const u16 = (n) => [n >> 8, n & 255],
          str = (s) => {
            const b = enc.encode(s);
            return [...u16(b.length), ...b];
          };
        const len = (n) => {
          const r = [];
          do {
            let d = n % 128;
            n = Math.floor(n / 128);
            r.push(n ? d | 128 : d);
          } while (n);
          return r;
        };
        const pkt = (h, b) =>
          ws && ws.readyState === 1 && ws.send(new Uint8Array([h, ...len(b.length), ...b]));
        const c = {
          ready: false,
          sub: (tp) => pkt(0x82, [0, 1, ...str(tp), 0]),
          unsub: (tp) => pkt(0xa2, [0, 2, ...str(tp)]),
          pub: (tp, s) => pkt(0x30, [...str(tp), ...enc.encode(s)]),
        };
        (function open() {
          ws = new WebSocket(url, 'mqtt');
          ws.binaryType = 'arraybuffer';
          ws.onopen = () => {
            pkt(0x10, [...str('MQTT'), 4, 2, 0, 30, ...str('ast' + rid())]);
            clearInterval(t);
            t = setInterval(() => pkt(0xc0, []), 20000);
          };
          ws.onmessage = (e) => {
            const a = new Uint8Array(e.data),
              n = new Uint8Array(buf.length + a.length);
            n.set(buf);
            n.set(a, buf.length);
            buf = n;
            while (buf.length > 1) {
              let i = 1,
                l = 0,
                m = 1,
                b;
              do {
                if (i >= buf.length) return;
                b = buf[i++];
                l += (b & 127) * m;
                m *= 128;
                if (m > 128 ** 4) {
                  buf = new Uint8Array(0);
                  ws.close();
                  return;
                }
              } while (b & 128);
              if (l > MAX_MQTT_PKT) {
                buf = new Uint8Array(0);
                ws.close();
                return;
              }
              if (buf.length < i + l) return;
              const h = buf[0],
                p = buf.slice(i, i + l);
              buf = buf.slice(i + l);
              if (h >> 4 === 2) {
                c.ready = true;
                onopen(c);
              } else if (h >> 4 === 3 && p.length >= 2) {
                const tl = (p[0] << 8) | p[1];
                onmsg(
                  dec.decode(p.subarray(2, 2 + tl)),
                  dec.decode(p.subarray(2 + tl + ((h >> 1) & 3 ? 2 : 0))),
                );
              }
            }
          };
          ws.onclose = () => {
            c.ready = false;
            buf = new Uint8Array(0);
            clearInterval(t);
            setTimeout(open, 3000);
          };
        })();
        return c;
      }

      const clients = [],
        seen = new Set();
      let topic = null,
        room = null,
        netId;
      const pub = async (o) => {
        if (!topic || !roomCryptoKey) return;
        o.m = rid();
        o.ts = Date.now();
        const p = await encryptPayload(o);
        clients.forEach((c) => c.ready && topic && c.pub(topic, p));
      };
      const announce = (re) => pub({ t: 'hi', from: me.id, name: me.name, device: me.device, re });
      const sig = (to, data) => pub({ t: 'sig', from: me.id, to, data });

      async function onmsg(tp, s) {
        if (tp !== topic) return;
        const o = await decryptPayload(s);
        if (
          !o ||
          typeof o !== 'object' ||
          typeof o.from !== 'string' ||
          !ID_RE.test(o.from) ||
          o.from === me.id
        )
          return;
        if (typeof o.m !== 'string' || seen.has(o.m) || (o.to && o.to !== me.id)) return;
        if (typeof o.ts !== 'number' || Math.abs(Date.now() - o.ts) > MSG_TTL) return;
        seen.add(o.m);
        if (seen.size > 1000) seen.delete(seen.values().next().value);
        if (o.t === 'hi') {
          const id = o.from;
          seenAt.set(id, Date.now());
          if (!peers.has(id))
            addPeer({
              id,
              name: cleanName(o.name, id),
              device: ICONS[o.device] ? o.device : 'desktop',
            });
          if (!o.re) pub({ t: 'hi', from: me.id, name: me.name, device: me.device, to: id, re: 1 });
        } else if (o.t === 'bye') removePeer(o.from);
        else if (o.t === 'sig') onSignal(o.from, o.data);
      }

      async function join(r) {
        if (topic) {
          await pub({ t: 'bye', from: me.id });
          clients.forEach((c) => c.ready && c.unsub(topic));
        }
        const old = topic;
        topic = null;
        roomCryptoKey = null;
        [...peers.keys()].forEach(removePeer);
        sessions.forEach(end);
        seen.clear();
        room = r;
        roomCryptoKey = await deriveRoomKey(r.id);
        topic =
          'astroid/v2/' +
          (r.kind === 'net' ? 'n/' : 'c/') +
          (await sha256hex('astroid-topic:' + r.id)).slice(0, 32);
        clients.forEach((c) => c.ready && c.sub(topic));
        announce();
        history.replaceState(
          null,
          '',
          r.kind === 'code' ? '#' + r.id : location.pathname + location.search,
        );
        status();
      }

      async function getIP() {
        for (const u of [
          'https://api.ipify.org?format=json',
          'https://ipv4.icanhazip.com',
          'https://www.cloudflare.com/cdn-cgi/trace',
        ]) {
          try {
            const ac = new AbortController(),
              t = setTimeout(() => ac.abort(), 4000);
            const r = await fetch(u, {
              signal: ac.signal,
              cache: 'no-store',
              referrerPolicy: 'no-referrer',
            });
            clearTimeout(t);
            const m = (await r.text()).match(
              /\b\d{1,3}(\.\d{1,3}){3}\b|[0-9a-f]{1,4}(:[0-9a-f]{0,4}){3,7}/i,
            );
            if (m) return m[0];
          } catch {}
        }
        return null;
      }

      async function toNet() {
        if (!netId) {
          const ip = await getIP();
          netId = ip ? await sha256hex('astroid-net:' + ip) : null;
        }
        if (netId) join({ kind: 'net', id: netId });
        else {
          toast('Network not found. Use a room code.');
          openRoom();
        }
      }

      function status() {
        const on = clients.some((c) => c.ready);
        $('#me').classList.toggle('off', !on);
        $('#nm').textContent = me.name;
        $('#rm').textContent = !on
          ? 'Offline'
          : !room
            ? '…'
            : room.kind === 'net'
              ? 'Network'
              : room.id.slice(0, 4) + '…';
      }

      const rd = $('#rdlg'),
        ri = $('#rin');
      function openRoom() {
        ri.value = room && room.kind === 'code' ? room.id : code();
        $('#copy').hidden = !(room && room.kind === 'code');
        rd.showModal();
        ri.select();
      }
      $('#me').onclick = openRoom;
      $('#goNet').onclick = () => {
        rd.close();
        toNet();
      };
      $('#goCode').onclick = () => {
        const v = ri.value
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, '')
          .slice(0, CODE_LEN);
        if (v.length < CODE_MIN) return toast(`Code needs at least ${CODE_MIN} characters`);
        rd.close();
        join({ kind: 'code', id: v });
      };
      $('#copy').onclick = async () => {
        const link = location.href.split('#')[0] + '#' + room.id;
        try {
          await navigator.clipboard.writeText(link);
          return toast('Link copied');
        } catch {}
        const a = document.createElement('textarea');
        a.value = link;
        a.style.cssText = 'position:fixed;opacity:0';
        rd.append(a);
        a.select();
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch {}
        a.remove();
        if (ok) toast('Link copied');
        else prompt('Copy link:', link);
      };
      ri.onkeydown = (e) => e.key === 'Enter' && $('#goCode').click();

      $('.self').innerHTML =
        `<svg class="ic" viewBox="0 0 24 24"><path d="${ICONS[device]}"/></svg>`;

      function layout() {
        const st = $('#stage'),
          R = Math.max(110, Math.min(st.clientWidth / 2 - 70, st.clientHeight / 2 - 80, 280));
        st.style.setProperty('--R', R + 'px');
        const els = [...peers.values()],
          n = els.length,
          outer = n > 6 ? Math.ceil(n / 2) : n;
        st.classList.toggle('has', n > 0);
        st.classList.toggle('many', n > 6);
        els.forEach((p, i) => {
          const o = i < outer,
            k = o ? i : i - outer,
            cnt = o ? outer : n - outer,
            r = o ? R : R * 0.58;
          const a = -Math.PI / 2 + (k / cnt) * 2 * Math.PI + (o ? 0 : Math.PI / cnt);
          p.el.style.setProperty('--x', Math.cos(a) * r + 'px');
          p.el.style.setProperty('--y', Math.sin(a) * r + 'px');
        });
      }
      addEventListener('resize', layout);

      function addPeer(p) {
        if (peers.has(p.id) || peers.size >= 24) return;
        const el = document.createElement('button'),
          h = hash(p.name);
        el.className = 'peer';
        el.style.setProperty('--h', Math.abs(h) % 360);
        el.style.setProperty('--b', blob(h));
        el.style.setProperty('--b2', blob(h + 7));
        el.innerHTML = `<span class="rock"><svg class="ic" viewBox="0 0 24 24"><path d="${ICONS[p.device]}"/></svg>
    <svg class="ring" viewBox="0 0 92 92"><circle class="bg" cx="46" cy="46" r="42"/><circle class="fg" cx="46" cy="46" r="42"/></svg></span>
    <span class="nm"></span><span class="sub"></span>`;
        el.querySelector('.nm').textContent = p.name;
        el.onclick = () => {
          const i = document.createElement('input');
          i.type = 'file';
          i.multiple = true;
          i.onchange = () => send(p.id, i.files);
          i.click();
        };
        el.ondragover = (e) => {
          e.preventDefault();
          el.classList.add('over');
        };
        el.ondragleave = () => el.classList.remove('over');
        el.ondrop = (e) => {
          e.preventDefault();
          el.classList.remove('over');
          send(p.id, e.dataTransfer.files);
        };
        peers.set(p.id, { ...p, el });
        $('#peers').append(el);
        void el.offsetWidth;
        el.classList.add('in');
        layout();
      }
      function removePeer(id) {
        const p = peers.get(id);
        if (!p) return;
        peers.delete(id);
        seenAt.delete(id);
        p.el.classList.remove('in');
        setTimeout(() => p.el.remove(), 300);
        sessions.forEach((s) => s.peerId === id && end(s));
        layout();
      }
      function ui(id, { wait, pct, text } = {}) {
        const p = peers.get(id);
        if (!p) return;
        p.el.classList.toggle('busy', pct != null);
        p.el.classList.toggle('wait', !!wait);
        p.el.querySelector('.fg').style.strokeDashoffset = 264 * (1 - (pct || 0));
        p.el.querySelector('.sub').textContent = text || '';
      }
      function prog(id, p, bytes) {
        const t = performance.now();
        if (!t0s.has(id)) t0s.set(id, t);
        if (p < 1 && t - (lastP.get(id) || 0) < 120) return;
        lastP.set(id, t);
        const v = Math.floor(p * 100);
        const el = (t - t0s.get(id)) / 1000;
        ui(id, { pct: p, text: v + ' %' + (el > 1 ? ' · ' + fmt(bytes / el) + '/s' : '') });
      }
      addEventListener('dragover', (e) => e.preventDefault());
      addEventListener('drop', (e) => e.preventDefault());

      function toast(text, file) {
        const t = document.createElement('div');
        t.className = 'snack';
        const s = document.createElement('span');
        s.textContent = text;
        t.append(s);
        if (file) {
          const a = document.createElement('a');
          a.textContent = 'Save';
          a.href = file.url;
          a.download = file.name;
          const cleanup = () => {
            if (file.url) {
              URL.revokeObjectURL(file.url);
              file.url = null;
            }
          };
          a.onclick = () => setTimeout(cleanup, 2000);
          const x = document.createElement('button');
          x.textContent = '✕';
          x.onclick = () => {
            cleanup();
            t.remove();
          };
          setTimeout(() => {
            cleanup();
            t.remove();
          }, 600000);
          t.append(a, x);
        } else setTimeout(() => t.remove(), 3500);
        $('#toasts').append(t);
      }

      let askQ = Promise.resolve(),
        pend = 0;
      const ask = (p, files) => {
        if (pend >= 3) return Promise.resolve(false);
        pend++;
        return (askQ = askQ
          .then(
            () =>
              new Promise((res) => {
                const d = $('#dlg'),
                  sum = files.reduce((a, f) => a + f.size, 0);
                d.querySelector('h2').textContent = p ? p.name : 'Unknown';
                d.querySelector('.info').textContent =
                  `${files.length} ${files.length > 1 ? 'files' : 'file'}, ${fmt(sum)}`;
                const ul = d.querySelector('ul');
                ul.replaceChildren();
                files.slice(0, 3).forEach((f) => {
                  const li = document.createElement('li');
                  li.textContent = f.name;
                  ul.append(li);
                });
                if (files.length > 3) {
                  const li = document.createElement('li');
                  li.textContent = `+ ${files.length - 3} more`;
                  ul.append(li);
                }
                d.returnValue = '';
                d.onclose = () => res(d.returnValue === 'ok');
                d.showModal();
              }),
          )
          .then((v) => {
            pend--;
            return v;
          }));
      };

      function makePC(sid, peerId) {
        const pc = new RTCPeerConnection({ iceServers: ICE, iceCandidatePoolSize: 2 });
        pc.onicecandidate = (e) => e.candidate && sig(peerId, { sid, ice: e.candidate });
        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'failed') {
            const s = sessions.get(sid);
            if (s) {
              toast('No connection');
              end(s);
            }
          }
        };
        return pc;
      }
      function end(s) {
        if (!sessions.delete(s.sid)) return;
        try {
          s.pc.close();
        } catch {}
        lastP.delete(s.peerId);
        t0s.delete(s.peerId);
        ui(s.peerId);
      }
      async function onSignal(from, d) {
        if (
          !d ||
          typeof d !== 'object' ||
          typeof d.sid !== 'string' ||
          !SID_RE.test(d.sid) ||
          !peers.has(from)
        )
          return;
        let s = sessions.get(d.sid);
        if (s) {
          if (s.peerId !== from) return;
        } else {
          if (!d.sdp || d.sdp.type !== 'offer') return;
          if (
            sessions.size >= MAX_SESSIONS ||
            [...sessions.values()].some((x) => x.peerId === from)
          )
            return;
          s = { sid: d.sid, peerId: from, pc: makePC(d.sid, from), q: Promise.resolve() };
          sessions.set(d.sid, s);
          ui(from, { wait: true, pct: 0.25 });
          s.pc.ondatachannel = (e) => receive(s, e.channel);
          setTimeout(() => {
            if (sessions.get(s.sid) === s && s.pc.connectionState !== 'connected') end(s);
          }, 30000);
        }
        const cur = s;
        s.q = s.q
          .then(async () => {
            if (d.sdp) {
              await cur.pc.setRemoteDescription(d.sdp);
              if (d.sdp.type === 'offer') {
                await cur.pc.setLocalDescription(await cur.pc.createAnswer());
                sig(from, { sid: d.sid, sdp: cur.pc.localDescription });
              }
            } else if (d.ice) await cur.pc.addIceCandidate(d.ice);
          })
          .catch(() => {});
      }
      function pipe(dc) {
        const q = [];
        let w = null,
          closed = false;
        dc.onmessage = (e) => {
          let m;
          try {
            m = JSON.parse(e.data);
          } catch {
            return;
          }
          w ? (w.res(m), (w = null)) : q.push(m);
        };
        dc.addEventListener('close', () => {
          closed = true;
          if (w) {
            w.rej(new Error('closed'));
            w = null;
          }
        });
        return () =>
          new Promise((res, rej) =>
            q.length ? res(q.shift()) : closed ? rej(new Error('closed')) : (w = { res, rej }),
          );
      }
      async function send(id, files) {
        files = [...files];
        if (
          !files.length ||
          [...sessions.values()].some((s) => s.peerId === id) ||
          sessions.size >= MAX_SESSIONS
        )
          return;
        if (files.length > MAX_FILES) return toast(`Too many files (max ${MAX_FILES})`);
        const total = files.reduce((a, f) => a + f.size, 0);
        if (total > MAX_FILE_SIZE) return toast(`Limit exceeded (max ${fmt(MAX_FILE_SIZE)})`);

        const sid = rid() + rid(),
          pc = makePC(sid, id),
          dc = pc.createDataChannel('f');
        dc.binaryType = 'arraybuffer';
        const s = { sid, pc, peerId: id, q: Promise.resolve() };
        sessions.set(sid, s);
        ui(id, { wait: true, pct: 0.25, text: 'Waiting…' });
        dc.onopen = () =>
          run(s, dc, files)
            .catch(() => toast('Cancelled'))
            .finally(() => end(s));
        await pc.setLocalDescription(await pc.createOffer());
        sig(id, { sid, sdp: pc.localDescription });
        setTimeout(() => {
          if (sessions.has(sid) && dc.readyState !== 'open') {
            toast('No connection');
            end(s);
          }
        }, 20000);
      }
      async function run(s, dc, files) {
        const next = pipe(dc),
          tx = (o) => dc.send(JSON.stringify(o));
        const gone = new Promise((_, r) =>
          dc.addEventListener('close', () => r(new Error('closed'))),
        );
        gone.catch(() => {});
        tx({
          t: 'offer',
          files: files.map((f) => ({ name: sanitizeFilename(f.name), size: f.size })),
        });
        if ((await next()).t !== 'ok') return toast('Declined');
        const total = files.reduce((a, f) => a + f.size, 0) || 1;
        let sent = 0;
        const chunk = Math.min(256 * 1024, (s.pc.sctp && s.pc.sctp.maxMessageSize) || 65536),
          t0 = performance.now();
        dc.bufferedAmountLowThreshold = HIGH_WATER / 2;
        ui(s.peerId, { pct: 0, text: '0 %' });
        const read = (f, o) => {
          const p = f.slice(o, o + BLOCK).arrayBuffer();
          p.catch(() => {});
          return p;
        };
        for (const f of files) {
          tx({ t: 'file' });
          let pre = f.size ? read(f, 0) : null;
          for (let o = 0; o < f.size; o += BLOCK) {
            const blk = await pre;
            pre = o + BLOCK < f.size ? read(f, o + BLOCK) : null;
            for (let i = 0; i < blk.byteLength; i += chunk) {
              if (dc.bufferedAmount > HIGH_WATER)
                await Promise.race([new Promise((r) => (dc.onbufferedamountlow = r)), gone]);
              const n = Math.min(chunk, blk.byteLength - i);
              dc.send(new Uint8Array(blk, i, n));
              sent += n;
              prog(s.peerId, sent / total, sent);
            }
          }
          tx({ t: 'end' });
        }
        await next();
        toast(`Sent ${fmt(sent)} in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
      }

      function receive(s, dc) {
        dc.binaryType = 'arraybuffer';
        let state = 'init',
          list = [],
          total = 1,
          got = 0,
          idx = 0,
          curGot = 0,
          inFile = false,
          parts = [],
          blobs = [],
          pending = 0;
        const abort = (msg) => {
          if (msg) toast(msg);
          state = 'done';
          try {
            dc.close();
          } catch {}
          end(s);
        };
        const valid = (f) =>
          f &&
          typeof f.name === 'string' &&
          f.name.length <= 1000 &&
          Number.isSafeInteger(f.size) &&
          f.size >= 0 &&
          f.size <= MAX_FILE_SIZE;

        dc.onmessage = async (e) => {
          if (state === 'done') return;
          if (typeof e.data !== 'string') {
            if (state !== 'accepted' || !inFile) return abort('Protocol error');
            curGot += e.data.byteLength;
            got += e.data.byteLength;
            if (curGot > list[idx].size || got > total)
              return abort('Peer sent more data than announced');
            parts.push(e.data);
            pending += e.data.byteLength;
            if (pending >= SPILL) {
              blobs.push(new Blob(parts));
              parts = [];
              pending = 0;
            }
            prog(s.peerId, got / total, got);
            return;
          }
          let m;
          try {
            m = JSON.parse(e.data);
          } catch {
            return abort('Protocol error');
          }
          if (!m || typeof m !== 'object') return abort('Protocol error');

          if (m.t === 'offer') {
            if (state !== 'init') return abort('Protocol error');
            state = 'asking';
            if (
              !Array.isArray(m.files) ||
              !m.files.length ||
              m.files.length > MAX_FILES ||
              !m.files.every(valid)
            ) {
              dc.send(JSON.stringify({ t: 'no' }));
              return abort('Invalid offer');
            }
            list = m.files.map((f) => ({ name: sanitizeFilename(f.name), size: f.size }));
            total = list.reduce((a, f) => a + f.size, 0);
            if (!Number.isSafeInteger(total) || total > MAX_FILE_SIZE) {
              dc.send(JSON.stringify({ t: 'no' }));
              return abort(`Declined: over ${fmt(MAX_FILE_SIZE)} limit`);
            }
            total = total || 1;
            const ok = await ask(peers.get(s.peerId), list);
            if (state === 'done' || dc.readyState !== 'open') return;
            dc.send(JSON.stringify({ t: ok ? 'ok' : 'no' }));
            if (ok) {
              state = 'accepted';
              ui(s.peerId, { pct: 0, text: '0 %' });
            } else state = 'done';
          } else if (m.t === 'file') {
            if (state !== 'accepted' || inFile || idx >= list.length)
              return abort('Protocol error');
            inFile = true;
            curGot = 0;
            parts = [];
            blobs = [];
            pending = 0;
          } else if (m.t === 'end') {
            if (state !== 'accepted' || !inFile || curGot !== list[idx].size)
              return abort('Incomplete file');
            const f = list[idx];
            toast(f.name, {
              url: URL.createObjectURL(
                new Blob([...blobs, ...parts], { type: 'application/octet-stream' }),
              ),
              name: f.name,
            });
            parts = [];
            blobs = [];
            pending = 0;
            inFile = false;
            if (++idx === list.length) {
              state = 'done';
              dc.send(JSON.stringify({ t: 'ack' }));
            }
          } else abort('Protocol error');
        };
        dc.onclose = () => {
          if (state !== 'done') toast('Cancelled');
          end(s);
        };
      }

      BROKERS.forEach((u) =>
        clients.push(
          mqtt(
            u,
            (c) => {
              topic && c.sub(topic);
              status();
              announce();
            },
            onmsg,
          ),
        ),
      );
      setInterval(() => {
        status();
        topic && announce(1);
        const now = Date.now();
        seenAt.forEach((t, id) => now - t > 55000 && removePeer(id));
      }, 15000);
      setInterval(status, 2000);
      addEventListener('pagehide', () => topic && pub({ t: 'bye', from: me.id }));
      const h = location.hash.slice(1).toUpperCase();
      if (new RegExp(`^[A-Z0-9]{${CODE_MIN},${CODE_LEN}}$`).test(h)) join({ kind: 'code', id: h });
      else toNet();
      status();
    </script>
  </body>
</html>
